name: Validate installer

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck and orchestration regressions
        run: |
          shellcheck -S warning ct/*.sh install/*.sh scripts/*.sh misc/*.func tests/*.sh
          bash tests/test-install.sh
  debian-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        release: [bookworm, trixie]
    steps:
      - uses: actions/checkout@v4
      - name: Test native CUPS install in disposable Debian
        run: docker run --rm -v "$PWD:/repo:ro" debian:${{ matrix.release }} bash /repo/tests/smoke-debian.sh
