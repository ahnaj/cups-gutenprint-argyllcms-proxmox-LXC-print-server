name: Shellcheck

on:
  push:
    paths:
      - "**/*.sh"
      - "**/*.func"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "**/*.sh"
      - "**/*.func"

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          scandir: "."
