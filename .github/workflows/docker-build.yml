name: Build Docker image

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "config/**"
      - "docker-compose.yml"
      - ".github/workflows/docker-build.yml"
  pull_request:
    paths:
      - "docker/**"
      - "config/**"
      - "docker-compose.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: cups-print-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container boots
        run: |
          docker run -d --name cups-ci \
            -e CUPS_USER=admin -e CUPS_PASSWORD=testpass123 \
            cups-print-server:ci
          sleep 8
          docker logs cups-ci
          docker exec cups-ci pgrep cupsd
          docker stop cups-ci
