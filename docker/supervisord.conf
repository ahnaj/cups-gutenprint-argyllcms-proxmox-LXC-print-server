[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:dbus]
command=/usr/bin/dbus-daemon --system --nofork --nopidfile
autorestart=true
priority=1

[program:avahi-daemon]
command=/usr/sbin/avahi-daemon --no-chroot -f /etc/avahi/avahi-daemon.conf
autorestart=true
priority=2
depends_on=dbus

[program:cupsd]
command=/usr/sbin/cupsd -f
autorestart=true
priority=3
stdout_logfile=/var/log/cups/access_log
stderr_logfile=/var/log/cups/error_log
