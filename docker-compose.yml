services:
  cups:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: cups-print-server:latest
    container_name: cups-print-server
    restart: unless-stopped
    hostname: ${SERVER_NAME:-cups-print-server}
    environment:
      - CUPS_USER=${CUPS_USER:-admin}
      - CUPS_PASSWORD=${CUPS_PASSWORD:-changeme}
      - CUPS_ADMIN_EMAIL=${CUPS_ADMIN_EMAIL:-admin@example.local}
      - SERVER_NAME=${SERVER_NAME:-cups-print-server}
      - TZ=${TZ:-Etc/UTC}
    ports:
      - "${CUPS_PORT:-631}:631"
    volumes:
      - ./data/cups:/etc/cups
      - ./data/log:/var/log/cups
      - ./data/spool:/var/spool/cups
    networks:
      - printnet

    # --- USB printer passthrough (uncomment ONE of the following) ---
    #
    # Option A: pass a specific device node (safer, recommended)
    # devices:
    #   - "/dev/usb/lp0:/dev/usb/lp0"
    #
    # Option B: give the container broad USB access (needed for some
    # multi-function/USB-class printers that enumerate dynamically)
    # privileged: true
    # volumes additionally:
    #   - /dev/bus/usb:/dev/bus/usb

  # Optional: ipp-usb bridges older USB-only printers to IPP-over-USB so
  # they behave like network printers. Uncomment if your printer needs it.
  # ipp-usb:
  #   image: ghcr.io/openprinting/ipp-usb:latest
  #   container_name: ipp-usb
  #   restart: unless-stopped
  #   privileged: true
  #   volumes:
  #     - /dev/bus/usb:/dev/bus/usb
  #     - ./data/ipp-usb:/var/lib/ipp-usb
  #   networks:
  #     - printnet

networks:
  printnet:
    driver: bridge
